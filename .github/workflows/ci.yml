# Run the tests on every push and pull request. Qt runs without a
# display (QT_QPA_PLATFORM=offscreen, set in tests/conftest.py).

name: Tests

on:
  push:
    branches-ignore: [main] # already verified in the PR
    tags-ignore: ['*'] # tags are handled by python-publish.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    name: tests-py${{ matrix.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history + tags for versioningit

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install package
        run: pip install -e .[dev]

      - name: Run tests
        run: python -m pytest -v
